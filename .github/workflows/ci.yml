name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The runner image ships Google Chrome; the real-browser suites use it with --no-sandbox.
      # xvfb-run gives the headful CAPTCHA suite (BROWSER_HEADFUL=true) a virtual X display —
      # the runner has no screen, and Chrome refuses to start headful without one.
      - run: xvfb-run -a npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm audit --omit=dev --audit-level=high
