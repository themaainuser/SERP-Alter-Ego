<script class="ds:3" nonce="Cbz1JWqoAgWs226doW9HRQ">AF_initDataCallback({key: 'ds:3', hash: '7', data:[[["/m/07zln7n","Alphabet Inc.","Alphabet Inc. is an American multinational technology conglomerate holding company headquartered in Mountain View, California. It was created through a restructuring of Google on October 2, 2015, and became the parent holding company of Google and several former Google subsidiaries. Alphabet is listed on the large-cap section of the Nasdaq under the ticker symbols GOOGL and GOOG; both classes of stock are components of major stock market indices such as the S&P 500 and Nasdaq-100. Alphabet has been described as a Big Tech company. As of July 2026, it is the third largest publicly traded company in the world by market capitalization.\nThe establishment of Alphabet Inc. was prompted by a desire to make the core Google business \"cleaner and more accountable\" while allowing greater autonomy to group companies that operate in businesses other than Internet services. Founders Larry Page and Sergey Brin announced their resignation from their executive posts in December 2019, with the CEO role to be filled by Sundar Pichai, who is also the CEO of Google. Page and Brin remain employees, board members, and controlling shareholders of Alphabet Inc.",["Mountain View","California","United States","US","1600 Amphitheatre Parkway"],[2015,10,2],"Sundar Pichai",198933,4188014286962.5854,340.92,344.15,352.6,340.99,408.61,235.84,363695,"USD",17.286255,0.25575447,24923804,19.90483,1.2212,5868000000,"https://abc.xyz/","USD","NASDAQ",3,3,1,2,null,"https://en.wikipedia.org/wiki/Alphabet_Inc.",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,2,2,2,2,2,2,0,null,null,null,null,null,null,null,null,null,null,null,null,0,0,0,0,0,[2026,9,4,4,null,null,null,[]],"Interactive media"]]], sideChannel: {}});</script>
